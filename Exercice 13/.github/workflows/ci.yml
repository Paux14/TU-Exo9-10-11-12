name: CI - Bank API

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du projet
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Exécution des tests et génération des rapports
        run: mvn verify
        working-directory: "Exercice 13"

      - name: Archivage des rapports Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "Exercice 13/target/surefire-reports"

      - name: Archivage du rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "Exercice 13/target/site/jacoco"

      - name: Archivage du rapport Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: "Exercice 13/target/cucumber-report.html"
